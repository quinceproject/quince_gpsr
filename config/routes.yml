# Trasy panelu Quince GPSR.
#
# `_legacy_controller` wskazuje zakładkę tego modułu, a nie zakładkę silnika:
# moduł stoi samodzielnie i musi mieć gdzie sprawdzać uprawnienia także wtedy,
# gdy `quince_engine` nie jest zainstalowany.

quince_gpsr_organizations:
  path: quince/gpsr
  methods: [GET]
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::indexAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'

quince_gpsr_organization_new:
  path: quince/gpsr/new
  methods: [GET]
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::editAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'
    code: ''

quince_gpsr_organization_edit:
  path: quince/gpsr/{code}/edit
  methods: [GET]
  requirements: {code: '[A-Za-z0-9_.:@-]+'}
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::editAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'

quince_gpsr_organization_save:
  path: quince/gpsr/save
  methods: [POST]
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::saveAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'

quince_gpsr_organization_delete:
  path: quince/gpsr/{code}/delete
  methods: [POST]
  requirements: {code: '[A-Za-z0-9_.:@-]+'}
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::deleteAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'

quince_gpsr_products:
  path: quince/gpsr/products
  methods: [GET]
  defaults:
    _controller: Quince\Gpsr\Controller\Admin\OrganizationsController::productsAction
    _legacy_controller: 'AdminQuinceGpsrOrganizations'
    _legacy_link: 'AdminQuinceGpsrOrganizations'
